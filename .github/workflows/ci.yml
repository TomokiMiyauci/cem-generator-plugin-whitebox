name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # lint:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v7

  #     - uses: denoland/setup-deno@v2
  #       with:
  #         cache: true

  #     - name: Install dependencies
  #       run: deno ci

  #     - name: Lint
  #       run: deno lint
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          cache: true

      - name: Install dependencies
        run: deno ci

      - name: Type Check
        run: deno task check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          cache: true

      - name: Install dependencies
        run: deno ci

      - name: Test
        run: deno task test
